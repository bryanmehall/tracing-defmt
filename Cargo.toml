[workspace]
members = ["decoder"]

[package]
name = "tracing-defmt"
version = "0.1.1"
edition = "2024"
description = "A syntax-compatible version of the tracing crate for no_std environments"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bryanmehall/tracing-defmt"

[dependencies]
critical-section = "1.2.0"
defmt = "1.0"
pin-project-lite = "0.2.17"
tracing-defmt-macros = { version = "0.1.1", path = "macros" }
cortex-m = { version = "0.7", optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
defmt = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"
opentelemetry-stdout = { version = "0.27", features = ["trace"] }
tokio = { version = "1", features = ["full"] }
tracing-fluent-assertions = "0.3.0"
hex = "0.4.3"
