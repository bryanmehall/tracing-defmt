[package]
name = "tracing-defmt-decoder"
version = "0.1.3"
edition = "2021"
description = "Host decoder for tracing-defmt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bryanmehall/tracing-defmt"

[dependencies]
defmt-decoder = "1.0"
tracing = "0.1"
tracing-opentelemetry = "0.28"
thiserror = "2.0"
log = "0.4"
opentelemetry = { version = "0.27", features = ["trace"] }
hex = "0.4.3"
defmt-parser = "1.0.0"
